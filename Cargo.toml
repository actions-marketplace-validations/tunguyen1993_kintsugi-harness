[package]
name = "kintsugi-harness"
version = "0.6.0"
edition = "2021"
description = "Sub-millisecond Rust native PreToolUse guardrail scanner and KMI/1 ultra-low-token skill compressor for coding agents."
license = "MIT"
authors = ["Tu Nguyen <tunguyen1993@users.noreply.github.com>"]
repository = "https://github.com/tunguyen1993/kintsugi-harness"
homepage = "https://github.com/tunguyen1993/kintsugi-harness"
keywords = ["ai-agents", "claude-code", "mcp", "static-analysis", "guardrails"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "kintsugi_core"
path = "rust/src/lib.rs"

[[bin]]
name = "kintsugi-rs"
path = "rust/src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
