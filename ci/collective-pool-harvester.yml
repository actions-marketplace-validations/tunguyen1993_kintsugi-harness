name: Kintsugi Collective Pool Relay & GitHub Skill Harvester

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest-and-sync-relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ingest Zero-GitHub-Account Relay & Harvest External GitHub Skills
        env:
          PYTHONPATH: src
        run: |
          python3 -m kintsugi.cli learn sync-relay --since 48h
          python3 -m kintsugi.cli learn harvest-github
          python3 -m kintsugi.cli learn pool-status

      - name: Commit and Push Verified Tier-1 Frontier Lessons
        run: |
          git config user.name "kintsugi-collective-bot"
          git config user.email "bot@kintsugi-harness.org"
          git add collective-pool/
          if ! git diff --cached --quiet; then
            git commit -m "chore(collective-pool): auto-ingest verified Frontier relay & GitHub skill lessons"
            git push
          fi
