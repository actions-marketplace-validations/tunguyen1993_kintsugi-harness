name: Kintsugi Security CI & OpenSSF Scorecard

on:
  push:
    branches: ["main", "opensource"]
  pull_request:
    branches: ["main", "opensource"]
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

jobs:
  unit-and-arena-verification:
    name: Deterministic Unit & 10-Arena Pareto Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository (pinned SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11 (pinned SHA)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run 44 Deterministic Unit Tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -q

      - name: Verify 10-Arena 5-Pillar Pareto Certificate
        env:
          PYTHONPATH: src
        run: python3 benchmarks/run_verifiable_arena_cert_suite.py

  openssf-scorecard:
    name: OpenSSF Security Scorecard Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository (pinned SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard analysis (pinned SHA)
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
